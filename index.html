<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COLONIZA - Autenticação</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#102018] min-h-screen flex items-center justify-center p-4">

  <div class="bg-white/95 backdrop-blur rounded-2xl shadow-2xl p-8 w-full max-w-md border border-emerald-900/20">
    <!-- Header do Login -->
    <div class="text-center mb-8">
      <!-- Container da Logo com Efeito Elegante -->
      <div class="inline-flex items-center justify-center p-3 bg-[#1b382b]/5 rounded-2xl mb-4 border border-[#1b382b]/10 shadow-sm">
        <img 
          src="https://lh3.googleusercontent.com/d/1CugN1KOVDxjxmwCVb3m2EzVW8beUYfSt" 
          alt="Logo COLONIZA" 
          class="h-20 w-auto object-contain drop-shadow-md"
        >
      </div>
      <h1 class="text-2xl font-bold text-[#1b382b] tracking-wide">COLONIZA</h1>
      <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Onde a excelência cria raízes</p>
    </div>

    <!-- Mensagem de Erro/Alerta -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm bg-red-100 text-red-700 border border-red-200"></div>

    <!-- Formulário -->
    <form id="loginForm" onsubmit="realizarLogin(event)" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">E-mail Corporativo</label>
        <input type="email" id="email" required placeholder="seu.nome@coloniza.com"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#1b382b] focus:border-transparent outline-none transition text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Senha de Acesso</label>
        <input type="password" id="senha" required placeholder="••••••••"
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#1b382b] focus:border-transparent outline-none transition text-sm">
      </div>

      <button type="submit" id="btnSubmit"
        class="w-full bg-[#1b382b] hover:bg-[#162e23] text-white font-medium py-3 rounded-lg transition duration-200 shadow-md flex items-center justify-center text-sm">
        <span id="btnText">Acessar o Sistema</span>
        <svg id="btnSpinner" class="hidden animate-spin ml-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </button>
    </form>

    <div class="mt-8 text-center border-t pt-4 border-gray-100">
      <p class="text-xs text-gray-400">COLONIZA &copy; Sistema de Gestão de Produção</p>
    </div>
  </div>

  <script>
    // URL do seu Google Apps Script (Substitua entre as aspas)
    const API_URL = "https://script.google.com/macros/s/AKfycbzn3J-hHcyoBMkENETimsBx4Dw9XbvcIAsVjWytSNfWQgCe-u_KcUTlDThdrCt8dJM/exec";

    async function realizarLogin(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const alertBox = document.getElementById('alertBox');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const btnSubmit = document.getElementById('btnSubmit');

      // Estado de carregamento
      alertBox.classList.add('hidden');
      btnText.textContent = "Autenticando...";
      btnSpinner.classList.remove('hidden');
      btnSubmit.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'login',
            email: email,
            senha: senha
          })
        });

        const result = await response.json();

        if (result.success) {
          // Salva os dados do usuário logado na sessão local do navegador
          localStorage.setItem('coloniza_user', JSON.stringify(result.user));
          localStorage.setItem('coloniza_login_ts', Date.now().toString());
          // Se veio de uma página protegida (ex: QR code de um bloco), volta pra ela. Senão, vai pro Dashboard.
          const params = new URLSearchParams(window.location.search);
          const redirectTo = params.get('redirect');
          let destino = "dashboard.html";
          if (redirectTo) {
            try {
              const urlDestino = new URL(redirectTo, window.location.origin);
              if (urlDestino.origin === window.location.origin) destino = urlDestino.href;
            } catch (e) { /* redirect inválido, ignora e usa o padrão */ }
          }
          window.location.href = destino;
        } else {
          alertBox.textContent = result.message || "Falha na autenticação.";
          alertBox.classList.remove('hidden');
        }
      } catch (err) {
        alertBox.textContent = "Erro ao conectar ao servidor. Verifique sua conexão.";
        alertBox.classList.remove('hidden');
      } finally {
        btnText.textContent = "Acessar o Sistema";
        btnSpinner.classList.add('hidden');
        btnSubmit.disabled = false;
      }
    }
  </script>
</body>
</html>
